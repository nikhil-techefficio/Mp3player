<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON File Editor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7fa;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    #jsonEditor {
      width: 100%;
      height: 300px;
      padding: 10px;
      font-family: monospace;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #f9f9f9;
      resize: vertical;
      display: block;
    }
    .button-container {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #0056b3;
      color: white;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>JSON File Editor</h1>
    <textarea id="jsonEditor" placeholder="Edit your JSON here..."></textarea>

    <div class="button-container">
      <button onclick="loadJSON()">Load JSON</button>
      <button onclick="saveJSON()">Save JSON</button>
      <button onclick="createNewFile()">Create New File</button>
      <button onclick="prettifyJSON()">Prettify JSON</button>
      <button onclick="minifyJSON()">Minify JSON</button>
    </div>
  </div>

  <script>
    let currentFileName = '';
    let currentJSONData = null;

    function loadJSON() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';

      input.onchange = (event) => {
        const file = event.target.files[0];
        currentFileName = file.name;
        const reader = new FileReader();

        reader.onload = (event) => {
          const jsonText = event.target.result;
          try {
            currentJSONData = JSON.parse(jsonText);
            document.getElementById('jsonEditor').value = JSON.stringify(currentJSONData, null, 2);
          } catch (error) {
            alert('Error parsing JSON file: ' + error);
          }
        };

        reader.readAsText(file);
      };

      input.click();
    }

    function saveJSON() {
      const jsonText = document.getElementById('jsonEditor').value;

      try {
        const jsonData = JSON.parse(jsonText);
        const blob = new Blob([JSON.stringify(jsonData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);

        const link = document.createElement('a');
        link.href = url;
        link.download = currentFileName || 'edited.json';
        link.click();

        URL.revokeObjectURL(url);
      } catch (error) {
        alert('Error saving JSON file: ' + error);
      }
    }

    function createNewFile() {
      const confirmNewFile = confirm("Are you sure you want to create a new file? This will clear the current content.");
      if (confirmNewFile) {
        document.getElementById('jsonEditor').value = '';
        currentJSONData = null;
        currentFileName = '';
      }
    }

    function prettifyJSON() {
      const jsonText = document.getElementById('jsonEditor').value;

      try {
        const jsonData = JSON.parse(jsonText);
        document.getElementById('jsonEditor').value = JSON.stringify(jsonData, null, 2);
      } catch (error) {
        alert('Error prettifying JSON: ' + error);
      }
    }

    function minifyJSON() {
      const jsonText = document.getElementById('jsonEditor').value;

      try {
        const jsonData = JSON.parse(jsonText);
        document.getElementById('jsonEditor').value = JSON.stringify(jsonData);
      } catch (error) {
        alert('Error minifying JSON: ' + error);
      }
    }
  </script>

</body>
</html>
