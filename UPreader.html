<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Viewer</title>
  <style>
    :root {
      --bg-color: #f4f4f4;
      --text-color: #333;
      --card-bg: #fff;
      --border-color: #ccc;
      --accent-color: #007bff;
      --error-color: #dc3545;
      --success-color: #28a745;
      --warning-color: #ffc107;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --card-bg: #1e1e1e;
      --border-color: #333;
      --accent-color: #0d6efd;
      --error-color: #f44336;
      --success-color: #4caf50;
      --warning-color: #ff9800;
    }

    [data-theme="vibrant"] {
      --bg-color: #ffefd5;
      --text-color: #333;
      --card-bg: #fff3e6;
      --border-color: #ffa07a;
      --accent-color: #ff4500;
      --error-color: #e63946;
      --success-color: #2a9d8f;
      --warning-color: #f4a261;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      width: 90%;
      max-width: 700px;
    }

    h1 {
      margin-bottom: 20px;
      color: var(--text-color);
      font-size: 24px;
    }

    input[type="file"] {
      display: block;
      margin: 20px auto;
      padding: 10px 15px;
      font-size: 16px;
      border: 2px solid var(--accent-color);
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    input[type="file"]:hover {
      background-color: var(--accent-color);
      color: #fff;
    }

    select {
      margin: 10px 0 20px;
      padding: 8px 12px;
      font-size: 14px;
      border: 2px solid var(--accent-color);
      border-radius: 5px;
      background: var(--bg-color);
      color: var(--text-color);
      cursor: pointer;
    }

    .output {
      text-align: left;
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 15px;
      background: var(--card-bg);
      margin-top: 20px;
      font-size: 14px;
    }

    h3 {
      margin-bottom: 10px;
      color: var(--text-color);
      font-size: 18px;
    }

    pre {
      background: var(--bg-color);
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-color);
    }

    p {
      margin: 0;
      padding: 5px 0;
    }

    .error {
      color: var(--error-color);
      font-weight: bold;
    }

    .success {
      color: var(--success-color);
    }

    .unsupported {
      color: var(--warning-color);
    }
  </style>
</head>
<body data-theme="light">
  <div class="container">
    <h1>File Viewer</h1>
    <select id="themeSelector">
      <option value="light">Light Theme</option>
      <option value="dark">Dark Theme</option>
      <option value="vibrant">Vibrant Theme</option>
    </select>
    <input type="file" id="fileInput" multiple>
    <div id="output" class="output">Selected file contents will appear here...</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
  <script>
    // Handle theme switching
    const themeSelector = document.getElementById('themeSelector');
    themeSelector.addEventListener('change', (event) => {
      document.body.setAttribute('data-theme', event.target.value);
    });

    document.getElementById('fileInput').addEventListener('change', async (event) => {
      const files = event.target.files;
      const outputDiv = document.getElementById('output');
      outputDiv.innerHTML = ''; // Clear previous output

      for (const file of files) {
        // Check file size (20 MB = 20 * 1024 * 1024 bytes)
        if (file.size > 20 * 1024 * 1024) {
          outputDiv.innerHTML += `<h3>${file.name}</h3><p class="error">File is too large (exceeds 20 MB)</p>`;
          continue; // Skip processing this file
        }

        const fileType = file.type;

        if (fileType === 'text/plain') {
          // Handle text files
          const text = await file.text();
          outputDiv.innerHTML += `<h3>${file.name}</h3><pre>${text}</pre>`;
        } else if (fileType === 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet') {
          // Handle Excel files
          const arrayBuffer = await file.arrayBuffer();
          const workbook = XLSX.read(arrayBuffer, { type: 'array' });
          workbook.SheetNames.forEach((sheetName) => {
            const sheet = XLSX.utils.sheet_to_html(workbook.Sheets[sheetName]);
            outputDiv.innerHTML += `<h3>${file.name} - Sheet: ${sheetName}</h3>${sheet}`;
          });
        } else if (fileType === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') {
          // Handle Word files
          const arrayBuffer = await file.arrayBuffer();
          const options = { includeDefaultStyleMap: true };
          const result = await mammoth.extractRawText({ arrayBuffer }, options);
          outputDiv.innerHTML += `<h3>${file.name}</h3><pre>${result.value}</pre>`;
        } else {
          outputDiv.innerHTML += `<h3>${file.name}</h3><p class="unsupported">Unsupported file type</p>`;
        }
      }
    });
  </script>
</body>
</html>
