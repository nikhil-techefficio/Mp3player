<!DOCTYPE html>
<html>
<head>
<title>Stock Prices</title>
<style>
table {
  border-collapse: collapse;
  width: 100%;
  margin-bottom: 20px;
}

th, td {
  text-align: left;
  padding: 8px;
  border: 1px solid #ddd;
}

tr:nth-child(even) { background-color: #f2f2f2; }

th {
  background-color: #4CAF50;
  color: white;
}

.error-text {
  color: red;
}

#statusMessage {
  margin: 10px 0;
  padding: 10px;
  border-radius: 4px;
}

.refresh-button {
  background-color: #4CAF50;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  margin-bottom: 10px;
}

.refresh-button:hover {
  background-color: #45a049;
}

.editable {
  background-color: #ffffe0;
  border: 1px solid #ccc;
  cursor: pointer;
}

.summary {
  font-size: 18px;
  font-weight: bold;
  margin-top: 20px;
  background: darkgray;
    padding: 6px;
    text-align: center;
    border-radius: 5px;
}
</style>
</head>
<body>

<h2>Stock Portfolio</h2>
<button id="refreshButton" class="refresh-button">Refresh Prices</button>
<button onclick="window.print()" class="refresh-button">Print</button>
<div id="statusMessage"></div>

<table id="stockTable">
  <tr>
    <th>Symbol</th>
    <th>Price</th>
    <th>Purchased At</th>
    <th>Volume Purchased</th>
    <th>Invested Amount</th>
    <th>Current Amount</th>
    <th>Profit/Loss</th>
    <th>Volume</th>
    <th>Last Updated</th>
  </tr>
</table>

<div class="summary">
  Total Invested: ₹<span id="totalInvested">0</span> | 
  Total Current Value: ₹<span id="totalCurrent">0</span> | 
  Overall Profit/Loss: ₹<span id="totalProfitLoss">0</span>
</div>

<script>
const stocks =  [
    { "Name": "ZOMATO.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "SUZLON.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "WIPRO.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "EXIDEIND.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "IFCI.NS","Purchased": "173", "Volume": "70" },
    { "Name": "MUKKA.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "NTPCGREEN.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "IRFC.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "IOC.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "BATAINDIA.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "EASEMYTRIP.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "EQUITASBNK.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "NHPC.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "CPSEETF.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "ALSTONE.BO", "Purchased": "173", "Volume": "70" },
    { "Name": "UCOBANK.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "NTPC.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "CANBK.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "CDSL.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "LEMONTREE.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "CASTROLIND.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "IRB.NS", "Purchased": "173", "Volume": "70" }
];

const CONFIG = {
    RETRY_ATTEMPTS: 3,
    RETRY_DELAY: 1000,
    RATE_LIMIT_DELAY: 500
};

function updateStatusMessage(message, isError = false) {
    const statusDiv = document.getElementById('statusMessage');
    statusDiv.textContent = message;
    statusDiv.style.backgroundColor = isError ? '#ffebee' : '#e8f5e9';
    statusDiv.style.color = isError ? '#c62828' : '#2e7d32';
}

function formatDateTime(date) {
    return date.toLocaleString();
}

function formatNumber(num) {
    return new Intl.NumberFormat('en-IN').format(num);
}

function clearTable() {
    const table = document.getElementById('stockTable');
    while (table.rows.length > 1) {
        table.deleteRow(1);
    }
}

function updateSummary() {
    let totalInvested = 0;
    let totalCurrent = 0;
    
    document.querySelectorAll("#stockTable tr").forEach((row, index) => {
        if (index === 0) return;

        let purchasedAt = parseFloat(row.cells[2].textContent) || 0;
        let volume = parseFloat(row.cells[3].textContent) || 0;
        let currentPrice = parseFloat(row.cells[1].textContent.replace("₹", "")) || 0;

        let investedAmount = purchasedAt * volume;
        let currentAmount = currentPrice * volume;
        let profitLoss = currentAmount - investedAmount;

        totalInvested += investedAmount;
        totalCurrent += currentAmount;

        row.cells[4].textContent = `₹${formatNumber(investedAmount)}`;
        row.cells[5].textContent = `₹${formatNumber(currentAmount)}`;
        row.cells[6].textContent = `₹${formatNumber(profitLoss)}`;
        row.cells[6].style.color = profitLoss >= 0 ? "green" : "red";
    });

    document.getElementById("totalInvested").textContent = formatNumber(totalInvested);
    document.getElementById("totalCurrent").textContent = formatNumber(totalCurrent);
    document.getElementById("totalProfitLoss").textContent = formatNumber(totalCurrent - totalInvested);
}

function makeCellEditable(cell) {
    cell.contentEditable = "true";
    cell.classList.add("editable");
    cell.addEventListener("input", updateSummary);
}

function addRowToTable(stock, data, isError = false) {
    const table = document.getElementById("stockTable");
    const newRow = table.insertRow();
    
    newRow.insertCell(0).textContent = stock.Name.split('.')[0];

    const priceCell = newRow.insertCell(1);
    priceCell.textContent = !isError && data ? `₹${parseFloat(data.price).toFixed(2)}` : "N/A";

    const purchasedCell = newRow.insertCell(2);
    purchasedCell.textContent = stock.Purchased || "Enter Price";
    makeCellEditable(purchasedCell);

    const volumeCell = newRow.insertCell(3);
    volumeCell.textContent = stock.Volume || "Enter Volume";
    makeCellEditable(volumeCell);

    newRow.insertCell(4).textContent = "₹0"; // Invested Amount
    newRow.insertCell(5).textContent = "₹0"; // Current Amount
    newRow.insertCell(6).textContent = "₹0"; // Profit/Loss

    newRow.insertCell(7).textContent = !isError && data ? formatNumber(data.volume) : "N/A";

    newRow.insertCell(8).textContent = formatDateTime(new Date());
}

async function fetchStockPrice(symbol) {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1d`;
    
    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        const data = await response.json();
        const quote = data.chart.result[0].meta;

        return { price: quote.regularMarketPrice, volume: quote.regularMarketVolume, success: true };
    } catch (error) {
        return { success: false };
    }
}

async function fetchAllStocks() {
    updateStatusMessage('Fetching stock prices...');
    clearTable();

    for (const stock of stocks) {
        const result = await fetchStockPrice(stock.Name);
        addRowToTable(stock, result.success ? result : null, !result.success);
    }

    updateSummary();
}

document.getElementById('refreshButton').addEventListener('click', fetchAllStocks);
document.addEventListener('DOMContentLoaded', fetchAllStocks);
</script>

</body>
</html>
