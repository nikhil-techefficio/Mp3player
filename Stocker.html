<!DOCTYPE html>
<html>
<head>
<title>Stock Prices</title>
<style>
table {
  border-collapse: collapse;
  width: 100%;
  margin-bottom: 20px;
}

th, td {
  text-align: left;
  padding: 8px;
  border: 1px solid #ddd;
}

tr:nth-child(even) { background-color: #f2f2f2; }

th {
  background-color: #4CAF50;
  color: white;
}

.error-text {
  color: red;
}

#statusMessage {
  margin: 10px 0;
  padding: 10px;
  border-radius: 4px;
}

.refresh-button {
  background-color: #4CAF50;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  margin-bottom: 10px;
}

.refresh-button:hover {
  background-color: #45a049;
}

.editable {
  background-color: #ffffe0;
  border: 1px solid #ccc;
  cursor: pointer;
}
</style>
</head>
<body>

<h2>Stock Prices</h2>
<button id="refreshButton" class="refresh-button">Refresh Prices</button>
<button onclick="window.print()" class="refresh-button">Print</button>
<div id="statusMessage"></div>

<table id="stockTable">
  <tr>
    <th>Symbol</th>
    <th>Price</th>
    <th>Purchased At</th>
    <th>Volume Purchased</th>
    <th>Volume</th>
    <th>Last Updated</th>
  </tr>
</table>

<script>
const stocks = [
    { "Name": "ZOMATO.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "SUZLON.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "WIPRO.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "EXIDEIND.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "IFCI.NS","Purchased": "173", "Volume": "70" },
    { "Name": "MUKKA.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "NTPCGREEN.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "IRFC.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "IOC.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "BATAINDIA.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "EASEMYTRIP.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "EQUITASBNK.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "NHPC.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "CPSEETF.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "ALSTONE.BO", "Purchased": "173", "Volume": "70" },
    { "Name": "UCOBANK.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "NTPC.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "CANBK.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "CDSL.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "LEMONTREE.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "CASTROLIND.NS", "Purchased": "173", "Volume": "70" },
    { "Name": "IRB.NS", "Purchased": "173", "Volume": "70" }
];

const CONFIG = {
    RETRY_ATTEMPTS: 3,
    RETRY_DELAY: 1000,
    RATE_LIMIT_DELAY: 500
};

function updateStatusMessage(message, isError = false) {
    const statusDiv = document.getElementById('statusMessage');
    statusDiv.textContent = message;
    statusDiv.style.backgroundColor = isError ? '#ffebee' : '#e8f5e9';
    statusDiv.style.color = isError ? '#c62828' : '#2e7d32';
}

function formatDateTime(date) {
    return date.toLocaleString();
}

function formatNumber(num) {
    return new Intl.NumberFormat('en-IN').format(num);
}

function clearTable() {
    const table = document.getElementById('stockTable');
    while (table.rows.length > 1) {
        table.deleteRow(1);
    }
}

function makeCellEditable(cell) {
    cell.contentEditable = "true";
    cell.classList.add("editable");
}

function addRowToTable(stock, data, isError = false) {
    const table = document.getElementById("stockTable");
    const newRow = table.insertRow();
    
    // Symbol
    const cell1 = newRow.insertCell(0);
    cell1.textContent = stock.Name.split('.')[0];

    if (!isError && data) {
        // Price
        const cell2 = newRow.insertCell(1);
        cell2.textContent = `₹${parseFloat(data.price).toFixed(2)}`;

        // Purchased At (Editable)
        const cell3 = newRow.insertCell(2);
        cell3.textContent = stock.Purchased || "Enter Price";
        makeCellEditable(cell3);

        // Volume Purchased (Editable)
        const cell4 = newRow.insertCell(3);
        cell4.textContent = stock.Volume || "Enter Volume";
        makeCellEditable(cell4);

        // Volume
        const cell5 = newRow.insertCell(4);
        cell5.textContent = formatNumber(data.volume);
    } else {
        const cell2 = newRow.insertCell(1);
        const cell3 = newRow.insertCell(2);
        const cell4 = newRow.insertCell(3);
        const cell5 = newRow.insertCell(4);
        cell2.textContent = 'N/A';
        cell3.textContent = stock.Purchased || 'Enter Price';
        cell4.textContent = stock.Volume || 'Enter Volume';
        cell5.textContent = 'N/A';
        cell2.className = 'error-text';
        makeCellEditable(cell3);
        makeCellEditable(cell4);
    }
    
    // Last Updated
    const cell6 = newRow.insertCell(5);
    cell6.textContent = formatDateTime(new Date());
}

async function fetchStockPrice(symbol) {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1d`;
    
    try {
        const response = await fetch(url);
        
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        
        if (data.chart.result && data.chart.result[0]) {
            const quote = data.chart.result[0].meta;
            
            return {
                price: quote.regularMarketPrice,
                volume: quote.regularMarketVolume,
                success: true
            };
        } else {
            throw new Error('Invalid API response');
        }
        
    } catch (error) {
        console.error(`Error fetching data for ${symbol}:`, error.message);
        return { success: false, error: error.message };
    }
}

async function fetchAllStocks() {
    updateStatusMessage('Fetching stock prices...');
    clearTable();
    
    let successCount = 0;
    let failureCount = 0;
    
    for (const stock of stocks) {
        try {
            const result = await fetchStockPrice(stock.Name);
            addRowToTable(stock, result.success ? result : null, !result.success);
            result.success ? successCount++ : failureCount++;
            await new Promise(resolve => setTimeout(resolve, CONFIG.RATE_LIMIT_DELAY));
        } catch (error) {
            failureCount++;
        }
    }
    
    updateStatusMessage(
        `Completed: ${successCount} successful, ${failureCount} failed`,
        failureCount > 0
    );
}

document.getElementById('refreshButton').addEventListener('click', fetchAllStocks);
document.addEventListener('DOMContentLoaded', fetchAllStocks);
</script>

</body>
</html>
